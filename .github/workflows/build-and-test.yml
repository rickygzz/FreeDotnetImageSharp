name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # net8.0: remove after .NET 8 end of support (November 10, 2026), together with net8.0 in the test project.
        framework: [net10.0, net8.0, net472]

    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Git Config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Git Checkout
        uses: actions/checkout@v4

      # The test images are stored in Git LFS. Cache them to limit LFS bandwidth usage.
      - name: Git Create LFS FileList
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Git Setup LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}-v1

      - name: Git Pull LFS
        run: git lfs pull

      - name: DotNet Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: NuGet Setup Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: DotNet Build
        run: dotnet build tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release -f ${{ matrix.framework }}

      - name: DotNet Test
        run: dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj --no-build -c Release -f ${{ matrix.framework }}

      - name: Export Failed Output
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: actual_output_${{ matrix.framework }}
          path: tests/Images/ActualOutput/

  pack:
    needs: [build]
    runs-on: windows-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: DotNet Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Packages are published to nuget.org manually; CI only builds them for download.
      - name: DotNet Pack
        run: dotnet pack src/ImageSharp/ImageSharp.csproj -c Release -o artifacts/nupkg

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: FreeDotnetImageSharp-nupkg
          path: artifacts/nupkg/*.nupkg
