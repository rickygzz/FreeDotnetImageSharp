version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # NuGet: security updates only (no routine version bumps), and never Six Labors packages.
  # SixLabors.ImageSharp 3.0+ and SixLabors.Fonts 2.0+ use the Six Labors Split License.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "SixLabors.*"
